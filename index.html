    <script>
      var typed = new Typed('.typed-words', {
        strings: ["танай тог их гарж байн уу"," тийм бол бидэнд даатга"],
        typeSpeed: 80,
        backSpeed: 80,
        backDelay: 4000,
        startDelay: 1000,
        loop: true,
        showCursor: true
      });

      // Google Form URL (change this to your form's URL)
      const googleFormURL = "https://docs.google.com/forms/d/e/1FAIpQLSfzVZy6Xikd6lb0lA4xhSTctzT9D53_PwFAhFIF1WsKLOc8Eg/formResponse"; // Replace with your form's URL

      // Calculate function
      function calculate() {
        var num = document.getElementById("numberInput").value;
        if(num) {
          var result = num * 10;
          document.getElementById("result").innerHTML = "Result: " + result;
          
          // Show the contact form after calculation
          document.getElementById("contactForm").style.display = "block";
          
          // Change the button text to "Send"
          document.querySelector(".btn-primary").innerText = "Send";
        } else {
          document.getElementById("result").innerHTML = "Please enter a number.";
        }
      }

      // Send contact form function
      function sendContactForm() {
        var email = document.getElementById("email").value;
        var phone = document.getElementById("phone").value;
        var result = document.getElementById("result").innerHTML.replace("Result: ", "");

        if (email && phone) {
          // Prepare the data to send to Google Form
          var data = {
            "entry.1234567890": email,   // Replace with your form's email field ID
            "entry.0987654321": phone,   // Replace with your form's phone field ID
            "entry.1122334455": result   // Replace with your form's result field ID
          };

          // Send data to Google Form via POST request
          $.ajax({
            url: googleFormURL,
            type: "POST",
            data: data,
            success: function(response) {
              alert("Contact details and result submitted!");
            },
            error: function() {
              alert("There was an error submitting the form.");
            }
          });
        } else {
          alert("Please fill out all fields.");
        }
      }
    </script>
